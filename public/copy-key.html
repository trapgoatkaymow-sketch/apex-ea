<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Copy license key — ApexEA</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #0b0b0f;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #16161d;
        border: 1px solid #2a2a35;
        border-radius: 16px;
        padding: 28px 22px;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ff7ab5;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        line-height: 1.25;
      }
      .key-box {
        margin: 0 0 16px;
        padding: 16px;
        background: #0b0b0f;
        border: 1px solid #3a3a48;
        border-radius: 12px;
      }
      .key {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #ff2d7a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        word-break: break-all;
        user-select: all;
        -webkit-user-select: all;
      }
      button {
        appearance: none;
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        font: 700 15px/1.2 inherit;
        color: #fff;
        background: linear-gradient(135deg, #ff2d7a, #ff1177);
        cursor: pointer;
      }
      .hint {
        margin: 14px 0 0;
        font-size: 13px;
        color: #9a9aaa;
        min-height: 1.2em;
      }
      .back {
        display: inline-block;
        margin-top: 18px;
        color: #ff7ab5;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">ApexEA license</p>
      <h1>Your license key</h1>
      <div class="key-box">
        <p class="key" id="key">—</p>
      </div>
      <button type="button" id="copy">Copy key</button>
      <p class="hint" id="hint"></p>
      <a class="back" href="https://www.apex-ea.com">Open apex-ea.com</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search || "");
        var key = String(params.get("key") || params.get("k") || "")
          .trim()
          .toUpperCase()
          .replace(/\s+/g, "");
        var keyEl = document.getElementById("key");
        var hint = document.getElementById("hint");
        var btn = document.getElementById("copy");
        if (!key || key.indexOf("APEX-") !== 0) {
          keyEl.textContent = "Missing key";
          btn.disabled = true;
          hint.textContent = "Open this page from your license email.";
          return;
        }
        keyEl.textContent = key;
        function flash(msg) {
          hint.textContent = msg;
        }
        async function copyKey() {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(key);
            } else {
              var range = document.createRange();
              range.selectNodeContents(keyEl);
              var sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
              document.execCommand("copy");
              sel.removeAllRanges();
            }
            flash("Copied");
            btn.textContent = "Copied";
            setTimeout(function () {
              btn.textContent = "Copy key";
            }, 1600);
          } catch (e) {
            flash("Long-press the key to copy");
          }
        }
        btn.addEventListener("click", copyKey);
        // Auto-copy when opened from the email button (best effort).
        copyKey();
      })();
    </script>
  </body>
</html>
