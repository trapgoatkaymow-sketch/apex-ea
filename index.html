<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apexea-shell-generation" content="22" />
    <title>apex-ea</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Early upgrade check — remote app-version only, one recovery per tab. */
      (function () {
        var GEN = 8;
        var KEY = "apexea-shell-gen-v1";
        var RECOVERY = "apexea-shell-recovery-v1";
        try {
          var seen = Number(localStorage.getItem(KEY) || 0);
          localStorage.setItem(KEY, String(Math.max(seen, GEN)));
        } catch (e) {}
        try {
          if (sessionStorage.getItem(RECOVERY) === "1") return;
          fetch("/app-version.json?t=" + Date.now(), {
            cache: "no-store",
            credentials: "omit",
            headers: { Accept: "application/json" },
          })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (v) {
              if (!v) return;
              var remoteGen = Number(v.shellGeneration || 0);
              if (!(remoteGen > GEN)) return;
              try {
                sessionStorage.setItem(RECOVERY, "1");
              } catch (e) {}
              var next = new URL(location.href);
              next.searchParams.set("_shell", String(remoteGen));
              next.searchParams.set("_t", String(Date.now()));
              location.replace(next.toString());
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
