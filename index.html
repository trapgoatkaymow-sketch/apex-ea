<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apexea-shell-generation" content="63" />
    <meta name="apexea-ui-locked" content="1" />
    <title>apex-ea</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
      }
      #apexea-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        font: 600 0.95rem/1.3 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.04em;
        background: #000;
        z-index: 99999;
      }
      #apexea-boot p {
        margin: 0;
        opacity: 0.78;
      }
      #apexea-boot button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border-radius: 999px;
        padding: 10px 18px;
        font: 600 0.85rem/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.03em;
      }
      #apexea-boot button[hidden] {
        display: none;
      }
    </style>
    <script>
      /* Kill stale service workers BEFORE the app module loads.
         A stuck SW can intercept /assets/*.js and leave the portal on Loading forever. */
      (function () {
        var GEN = 58;
        var FLOOR = 51;
        var KEY = "apexea-shell-gen-v1";
        var LOCK_KEY = "apexea-ui-lock-floor-v1";
        var RECOVERY = "apexea-shell-recovery-v1";
        var BOOT_RETRY = "apexea-boot-retry-v1";

        function nukeCaches() {
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) {
                  try { reg.unregister(); } catch (e) {}
                });
              }).catch(function () {});
            }
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (key) {
                  try { caches.delete(key); } catch (e) {}
                });
              }).catch(function () {});
            }
          } catch (e) {}
        }

        function hardReload(reason) {
          try {
            var next = new URL(location.href);
            next.searchParams.set("_boot", reason || "retry");
            next.searchParams.set("_t", String(Date.now()));
            location.replace(next.toString());
          } catch (e) {
            location.reload();
          }
        }

        window.__apexeaRecover = function () {
          nukeCaches();
          try { sessionStorage.setItem(BOOT_RETRY, "1"); } catch (e) {}
          hardReload("tap");
        };

        nukeCaches();

        try {
          var seen = Number(localStorage.getItem(KEY) || 0);
          localStorage.setItem(KEY, String(Math.max(seen, GEN)));
          var prevFloor = Number(localStorage.getItem(LOCK_KEY) || 0);
          localStorage.setItem(LOCK_KEY, String(Math.max(prevFloor, FLOOR, GEN)));
        } catch (e) {}

        /* Remote shell upgrade — one recovery per tab. Locked product floor
           also forces older HTML shells onto the live locked UI. */
        try {
          if (sessionStorage.getItem(RECOVERY) !== "1") {
            fetch("/app-version.json?t=" + Date.now(), {
              cache: "no-store",
              credentials: "omit",
              headers: { Accept: "application/json" },
            })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (v) {
                if (!v) return;
                var remoteGen = Number(v.shellGeneration || 0);
                var remoteFloor = Number(
                  v.minShellGeneration || v.shellFloor || (v.uiLocked ? remoteGen : 0) || 0
                );
                var needsUpgrade =
                  (remoteGen > GEN) ||
                  (remoteFloor > 0 && GEN < remoteFloor);
                if (!needsUpgrade) return;
                try { sessionStorage.setItem(RECOVERY, "1"); } catch (e) {}
                hardReload("shell");
              })
              .catch(function () {});
          }
        } catch (e) {}

        /* If the app module never executes, show Retry and auto-recover once.
           Skip when dataset.apexeaBoot is set (module started) even if paint is slow. */
        window.addEventListener("DOMContentLoaded", function () {
          var boot = document.getElementById("apexea-boot");
          if (!boot) return;
          var retryBtn = document.getElementById("apexea-boot-retry");
          setTimeout(function () {
            if (!document.getElementById("apexea-boot")) return;
            if (document.documentElement.getAttribute("data-apexea-boot") === "1") return;
            if (retryBtn) retryBtn.hidden = false;
            var already = false;
            try { already = sessionStorage.getItem(BOOT_RETRY) === "1"; } catch (e) {}
            if (!already) {
              try { sessionStorage.setItem(BOOT_RETRY, "1"); } catch (e) {}
              nukeCaches();
              hardReload("watchdog");
            }
          }, 8000);
        });
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="apexea-boot">
        <p>Loading apex-ea…</p>
        <button id="apexea-boot-retry" type="button" hidden onclick="window.__apexeaRecover && window.__apexeaRecover()">
          Tap to retry
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
